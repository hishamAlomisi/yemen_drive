name: yemen_drive
description: Arabic RTL taxi booking UI based on the Yemen Drive Figma community kit.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.2
  dio: ^5.9.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.1
  country_picker: ^2.0.27
  google_maps_flutter: ^2.13.1
  google_maps_flutter_android: ^2.19.13
  google_maps_flutter_platform_interface: ^2.16.1
  geolocator: ^14.0.2
  signalr_netcore: ^1.4.4
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  record: ^7.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  cached_network_image: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
  fonts:
    - family: BeINArabic
      fonts:
        - asset: assets/fonts/bein_ar_regular.ttf
          weight: 400
